name: decode-icons
on:
  push:
    paths: ['*.b64']
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in *.b64; do base64 -d "$f" > "${f%.b64}"; git rm -q "$f"; done
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add *.png && git commit -m "Decode icons" && git push
